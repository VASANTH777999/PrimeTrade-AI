<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login • PrimeTrade AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="app-bg" style="font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;">
  <header class="glass-card">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="h-8 w-8 rounded bg-indigo-600"></div>
        <a href="/" class="font-bold text-xl">PrimeTrade AI</a>
      </div>
      <nav class="space-x-4">
        <a id="nav-login" href="/login" class="btn btn-outline">Login</a>
        <a id="nav-register" href="/register" class="btn btn-secondary">Register</a>
        <a id="nav-dashboard" href="/dashboard" class="btn btn-primary hidden">Dashboard</a>
        <button id="nav-logout" class="btn btn-outline hidden">Logout</button>
      </nav>
    </div>
  </header>
  <main class="max-w-lg mx-auto px-4 py-10">
    <div class="glass-card p-6">
      <h2 class="text-xl font-semibold mb-4 text-gradient">Login</h2>
      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-sm font-medium">Email</label>
          <input type="email" id="login-email" class="mt-1 w-full input" required />
        </div>
        <div>
          <label class="block text-sm font-medium">Password</label>
          <input type="password" id="login-password" class="mt-1 w-full input" required />
        </div>
        <button class="btn btn-primary">Login</button>
      </form>
      <p id="login-message" class="mt-4 text-sm"></p>
    </div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
